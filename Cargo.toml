[package]
name = "ketal"
version = "0.5.2"
edition = "2024"

[dependencies]
argon2 = "0.5"
aws-config = "1"
aws-sdk-sesv2 = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
bcrypt = "0.19.3"
dotenvy = "0.15"
jsonrpc-usecase = { git = "https://github.com/pierrerolland/jsonrpc-usecase", features = ["axum"], version = "0.6.0" }
jsonwebtoken = { version = "10.4", features = ["rust_crypto"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rsa = { version = "0.9", features = ["pkcs5"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }
